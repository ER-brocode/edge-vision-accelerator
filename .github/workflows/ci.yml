name: EVA CI/CD Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-test:
    name: Python Test Suite (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install numpy scipy pytest opencv-python onnxruntime filterpy

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v

      - name: Run Pipeline Benchmark
        run: |
          python benchmarks/benchmark_pipeline.py

  cpp-build:
    name: C++ Native Acceleration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_TESTS=ON

      - name: Build C++ Native Core
        run: |
          cmake --build build --config Release

      - name: Run Native C++ Tests
        run: |
          ctest --test-dir build -C Release --output-on-failure || ./build/eva_test_suite || ./build/Release/eva_test_suite.exe
