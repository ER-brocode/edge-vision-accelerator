[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-vision-accelerator"
version = "1.0.0"
description = "Edge Vision AI Stream Processor with Neural Accelerators in C++/Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "koushik4475", email = "koushik4475@gmail.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
]

[project.optional-dependencies]
opencv = [
    "opencv-python>=4.6.0",
]
onnx = [
    "onnxruntime>=1.15.0",
]
tracking = [
    "lap>=0.4.0",
    "filterpy>=1.4.5",
]
dev = [
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
all = [
    "opencv-python>=4.6.0",
    "onnxruntime>=1.15.0",
    "lap>=0.4.0",
    "filterpy>=1.4.5",
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/ER-brocode/edge-vision-accelerator"
Repository = "https://github.com/ER-brocode/edge-vision-accelerator.git"
Issues = "https://github.com/ER-brocode/edge-vision-accelerator/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["edge_vision_accelerator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
